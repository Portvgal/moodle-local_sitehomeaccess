name: Moodle Plugin CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Moodle 4.5 / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            database: pgsql
          - php: '8.2'
            database: mariadb
          - php: '8.3'
            database: pgsql

    steps:
      - name: Check out repository code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: max_input_vars=5000, opcache.enable_cli=1, opcache.jit=disable

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle test environment
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP mess detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle coding standards
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Front-end lint and build checks
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: behat-faildump-php-${{ matrix.php }}-${{ matrix.database }}
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1

  required:
    name: Required checks
    if: ${{ always() }}
    needs:
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  release:
    name: Release package
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - required
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false

      - name: Validate tag and plugin metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          component=$(awk -F"'" '/^\$plugin->component = / {print $2}' plugin/version.php)
          release=$(awk -F"'" '/^\$plugin->release = / {print $2}' plugin/version.php)
          tagrelease=${GITHUB_REF_NAME#v}

          test "$component" = 'local_sitehomeaccess'
          test -n "$release"
          test "$tagrelease" = "$release"

          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "archive=moodle-local_sitehomeaccess-$release.zip" >> "$GITHUB_OUTPUT"

      - name: Build package from tagged tree
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir package
          git -C plugin archive --format=tar --prefix=sitehomeaccess/ HEAD | tar -xf - -C package
          rm -rf package/sitehomeaccess/.github package/sitehomeaccess/marketplace
          (cd package && zip -q -r "../$ARCHIVE" sitehomeaccess)

      - name: Validate package contents
        env:
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          unzip -t "$ARCHIVE"
          unzip -Z1 "$ARCHIVE" > archive-contents.txt
          grep -qx 'sitehomeaccess/version.php' archive-contents.txt
          grep -qx 'sitehomeaccess/README.md' archive-contents.txt
          grep -qx 'sitehomeaccess/LICENSE' archive-contents.txt

          if grep -Eq '(^|/)(\.git|\.github|marketplace|\.DS_Store)(/|$)' archive-contents.txt; then
            echo 'Development-only content was found in the release archive.' >&2
            exit 1
          fi

          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload validated package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sitehomeaccess-${{ steps.metadata.outputs.release }}
          path: |
            ${{ steps.metadata.outputs.archive }}
            ${{ steps.metadata.outputs.archive }}.sha256
          if-no-files-found: error

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
          RELEASE: ${{ steps.metadata.outputs.release }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$ARCHIVE" \
            "$ARCHIVE.sha256" \
            --verify-tag \
            --title "Site Home Access $RELEASE" \
            --generate-notes
